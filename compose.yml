services:
  app:
    build:
      context: .
      args:
        # 平文 http で直に開くので、origin をビルド時に埋め込む (CSRF 判定用)
        ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=/app/data/mogiri.db
      - PUBLIC_BASE_URL=http://localhost:3000
      # Email via Azure Communication Services (leave unset to log links instead):
      # - ACS_CONNECTION_STRING=endpoint=https://<res>.communication.azure.com/;accesskey=<key>
      # - ACS_SENDER_ADDRESS=DoNotReply@<guid>.azurecomm.net
      # Fill these in to enable card / Square payments:
      # - STRIPE_SECRET_KEY=sk_test_xxx
      # - PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_xxx
      # - PUBLIC_SQUARE_APPLICATION_ID=sq0idp-xxx
      # - PUBLIC_SQUARE_CALLBACK_URL=http://localhost:3000/real/square
    volumes:
      - db:/app/data

volumes:
  db:
