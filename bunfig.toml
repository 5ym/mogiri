# Ensure Vite's dev/build SSR pipeline runs on the Bun runtime so that
# `bun:sqlite` (used by the Drizzle SQLite driver) resolves correctly.
[run]
bun = true

# 整形 (`bun fmt`。`package.json` の format・lint から呼ぶ)。書き方は既定のまま、外すものだけ
[fmt]
# import を並べ替える (組の分け方は既定のまま。副作用だけの import は動かさない)
sortImports = true
ignorePatterns = ["renovate.json"]
